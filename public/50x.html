    <title>الخدمة غير متاحة مؤقتًا · انتخابات المجالس البلدية 2026</title>

    </script>
    <style>
      @font-face {
  font-family: plex;
  font-weight: 700;
  font-display: swap;
  src: url('/fonts/ibm-plex-sans-arabic-700.woff2') format('woff2');
}
:root {
  color-scheme: dark;
  --bg0: #060b1a;
  --bg1: #0b1430;
  --bg2: #152452;
  --ink: #f4f1ea;
  --muted: #b8bfd3;
  --gold: #e8b04a;
  --g1: #ffd27a;
  --g2: #e8b04a;
  --g3: #9a6200;
  --pale: #fff4dc;
  --on-gold: #14182b;
  --glass: rgba(255, 255, 255, 0.07);
  --glass-hi: rgba(255, 255, 255, 0.12);
  --stroke: rgba(255, 255, 255, 0.18);
  --lattice: rgba(232, 176, 74, 0.16);
  --dune-far: #0d1838;
  --dune-near: #080f26;
  --alert: #ff3b5c;
  --ok: #2ee59d;
  --focus: #ffd27a;
  --shadow: 0 30px 80px -24px rgba(2, 6, 24, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  --px: 0;
  --py: 0;
}
[data-theme='daylight'] {
  color-scheme: light;
  --bg0: #f7f1e6;
  --bg1: #efe6d4;
  --bg2: #fffaf0;
  --ink: #14182b;
  --muted: #5b5446;
  --gold: #8a5700;
  --g1: #d4a64a;
  --g2: #9a6200;
  --g3: #5b3d00;
  --pale: #fff4dc;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-hi: rgba(255, 255, 255, 0.85);
  --stroke: rgba(122, 88, 34, 0.28);
  --lattice: rgba(154, 98, 0, 0.12);
  --dune-far: #eadbbd;
  --dune-near: #e1cda6;
  --alert: #c81d36;
  --ok: #09704c;
  --focus: #9a6200;
  --shadow: 0 24px 60px -24px rgba(120, 84, 30, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
*,
*::before,
*::after {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html {
  min-height: 100%;
  background: var(--bg0);
}
body {
  margin: 0;
}
body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  font-family: plex, 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-size-adjust: 100%;
  overflow-x: hidden;
}
.ep-sky {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background:
    radial-gradient(120% 70% at 50% 108%, var(--bg2) 0%, transparent 62%),
    linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%);
}
.ep-glow {
  position: absolute;
  inset-inline-start: 50%;
  bottom: -38vh;
  width: 150vw;
  height: 80vh;
  translate: -50% 0;
  border-radius: 50%;
  background: radial-gradient(
    closest-side,
    rgba(232, 176, 74, 0.28),
    rgba(232, 176, 74, 0.08) 55%,
    transparent
  );
  animation: ep-breathe 9s ease-in-out infinite;
}
.ep-stars {
  position: absolute;
  inset: 0;
  translate: calc(var(--px) * -10px) calc(var(--py) * -8px);
  animation: ep-rise 260s linear infinite;
}
.ep-stars::before,
.ep-stars::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 50%;
}
.ep-stars::after {
  top: 1400px;
}
.ep-stars.s2 {
  translate: calc(var(--px) * -20px) calc(var(--py) * -14px);
  animation:
    ep-rise 190s linear infinite,
    ep-twinkle 5s ease-in-out infinite alternate;
}
.ep-stars.s3 {
  translate: calc(var(--px) * -34px) calc(var(--py) * -24px);
  animation:
    ep-rise 130s linear infinite,
    ep-twinkle 7s 1.5s ease-in-out infinite alternate;
}
.ep-meteor {
  position: absolute;
  top: 10%;
  left: 78%;
  width: 180px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--pale), transparent);
  opacity: 0;
  animation: ep-meteor 11s 2s ease-in infinite;
}
.ep-meteor.m2 {
  top: 26%;
  left: 40%;
  width: 130px;
  animation-duration: 14s;
  animation-delay: 8s;
}
.ep-lat {
  position: absolute;
  inset: 0;
}
.ep-lattice {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: ep-lattice 9s ease-in-out infinite;
}
.ep-lattice path {
  fill: none;
  stroke: var(--lattice);
  stroke-width: 1;
}
.ep-dunes {
  position: absolute;
  inset-inline: 0;
  bottom: 0;
  width: 100%;
  height: 26vh;
  translate: calc(var(--px) * 8px) 0;
}
.ep-dunes .far {
  fill: var(--dune-far);
}
.ep-dunes .near {
  fill: var(--dune-near);
}
[data-theme='daylight'] :is(.ep-stars, .ep-meteor) {
  display: none;
}
.ep-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: max(20px, env(safe-area-inset-top)) 16px 0;
  animation: ep-fade 700ms ease-out both;
}
.ep-logo {
  height: 44px;
  width: auto;
}
.ep-sep {
  width: 1px;
  height: 32px;
  background: var(--stroke);
}
.ep-foot {
  padding: 16px 16px max(18px, env(safe-area-inset-bottom));
  text-align: center;
  font-size: 0.8125rem;
  color: var(--muted);
  animation: ep-fade 700ms 600ms ease-out both;
}
.ep-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
.ep-art {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.03em;
  font-size: clamp(6.5rem, 24vw, 13.5rem);
  font-weight: 700;
  line-height: 0.9;
  margin-bottom: clamp(8px, 3vh, 28px);
  user-select: none;
}
.ep-d {
  background: linear-gradient(
    110deg,
    var(--g3) 0%,
    var(--g2) 28%,
    var(--g1) 44%,
    var(--pale) 50%,
    var(--g1) 56%,
    var(--g2) 72%,
    var(--g3) 100%
  );
  background-size: 300% 100%;
  background-position: 100% 0;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0.04em 0.12em rgba(232, 176, 74, 0.32));
  animation:
    ep-in 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both,
    ep-shine 7s 1.2s ease-in-out infinite;
}
.ep-d:last-child {
  animation-delay: 240ms, 1.5s;
}
.ep-orb {
  width: 0.74em;
  height: 0.74em;
  filter: drop-shadow(0 0 0.08em rgba(255, 210, 122, 0.35));
  animation:
    ep-in 900ms 120ms cubic-bezier(0.2, 0.8, 0.2, 1) both,
    ep-float 6s 1s ease-in-out infinite;
}
.ep-orb svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.ep-orb .ga {
  stop-color: var(--g1);
}
.ep-orb .gb {
  stop-color: var(--g2);
}
.ep-orb .gc {
  stop-color: var(--g3);
}
.ep-orb .ca {
  stop-color: var(--pale);
}
.ep-orb .cb {
  stop-color: var(--pale);
  stop-opacity: 0;
}
.ep-ring {
  fill: none;
  stroke: url('#ep-g');
  stroke-width: 24;
}
.ep-ticks {
  fill: none;
  stroke: var(--gold);
  stroke-opacity: 0.5;
  stroke-width: 2;
  stroke-dasharray: 2 9;
}
.ep-ticks,
.ep-comet,
.ep-pulses circle {
  transform-box: view-box;
  transform-origin: 50% 50%;
}
.ep-ticks {
  animation: ep-spin 48s linear infinite reverse;
}
.ep-comet {
  fill: var(--pale);
  animation: ep-spin 5.5s linear infinite;
}
.ep-comet path {
  fill: none;
  stroke: var(--pale);
  stroke-opacity: 0.55;
  stroke-width: 5;
  stroke-linecap: round;
}
.ep-pulses circle {
  fill: none;
  stroke: var(--gold);
  stroke-width: 2;
  opacity: 0;
}
[data-kind='50x'] .ep-pulses circle {
  animation: ep-pulse 3.6s ease-out infinite;
}
[data-kind='50x'] .ep-pulses circle:nth-child(2) {
  animation-delay: 1.2s;
}
[data-kind='50x'] .ep-pulses circle:nth-child(3) {
  animation-delay: 2.4s;
}
[data-off] .ep-pulses circle,
[data-off] .ep-comet {
  animation-play-state: paused;
  opacity: 0;
}
[data-off] .ep-orb,
[data-off] .ep-d {
  filter: grayscale(0.8);
}
.ep-card {
  position: relative;
  width: min(580px, 100%);
  padding: 30px clamp(20px, 5vw, 36px) 22px;
  border-radius: 28px;
  overflow: hidden;
  text-align: center;
  background: var(--glass);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px) saturate(1.25);
  -webkit-backdrop-filter: blur(16px) saturate(1.25);
  animation: ep-up 800ms 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
  --mx: 50%;
  --my: 0%;
}
.ep-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline: 14%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--g1), transparent);
}
.ep-card::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(
    420px circle at var(--mx) var(--my),
    rgba(255, 210, 122, 0.12),
    transparent 62%
  );
  opacity: 0;
  transition: opacity 300ms;
}
.ep-card.lit::after {
  opacity: 1;
}
.ep-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
  background: color-mix(in srgb, var(--gold) 10%, transparent);
  color: var(--gold);
  font-size: 0.8125rem;
  font-weight: 700;
  line-height: 1.2;
}
.ep-dot {
  position: relative;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
}
[data-kind='50x'] .ep-dot {
  background: var(--alert);
}
[data-off] .ep-dot {
  background: var(--muted);
}
.ep-dot::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: inherit;
  animation: ep-ping 2s ease-out infinite;
}
h1 {
  margin: 16px 0 8px;
  font-size: clamp(1.55rem, 4.6vw, 2.2rem);
  font-weight: 700;
  line-height: 1.35;
}
.ep-text {
  max-width: 44ch;
  margin: 0 auto;
  color: var(--muted);
  font-size: 1.0625rem;
  line-height: 1.9;
}
.ep-retry {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: fit-content;
  margin: 20px auto 0;
  padding: 8px 16px 8px 12px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--stroke);
  font-size: 0.9375rem;
}
.ep-cd {
  width: 36px;
  height: 36px;
  flex: none;
}
.ep-cd circle {
  fill: none;
  stroke-width: 3;
}
.ep-cd .trk {
  stroke: var(--stroke);
}
.ep-cd .arc {
  stroke: var(--gold);
  stroke-linecap: round;
  stroke-dasharray: 106.8;
  transform: rotate(-90deg);
  transform-box: fill-box;
  transform-origin: center;
}
.ep-cd .chk {
  fill: none;
  stroke: var(--ok);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 22;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset 400ms 150ms ease-out;
}
[data-state='check'] .ep-cd {
  animation: ep-spin 1s linear infinite;
}
[data-state='check'] .ep-cd .arc {
  stroke-dashoffset: 75;
}
[data-state='ok'] .ep-cd .arc {
  stroke: var(--ok);
  stroke-dashoffset: 0;
}
[data-state='ok'] .ep-cd .chk {
  stroke-dashoffset: 0;
}
[data-state='off'] .ep-cd .arc {
  stroke-dashoffset: 106.8;
}
.ep-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.ep-acts {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
}
.ep-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 14px;
  border: 1px solid transparent;
  overflow: hidden;
  font: inherit;
  font-size: 1rem;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform 160ms ease-out,
    box-shadow 160ms ease-out;
}
.ep-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ep-btn.pri {
  color: var(--on-gold);
  background: linear-gradient(135deg, #ffd27a, #e8b04a 55%, #d4a64a);
  box-shadow: 0 12px 30px -12px rgba(232, 176, 74, 0.75);
}
.ep-btn.pri::after {
  content: '';
  position: absolute;
  inset: -20% auto -20% 0;
  width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: translateX(-160%) skewX(-20deg);
  animation: ep-sheen 5s 1.6s ease-in-out infinite;
}
.ep-btn.sec {
  color: var(--ink);
  background: var(--glass-hi);
  border-color: var(--stroke);
}
.ep-btn:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.ep-btn:active {
  transform: scale(0.97);
}
.ep-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}
@media (hover: hover) {
  .ep-btn:not(:disabled):hover {
    transform: translateY(-2px);
  }
  .ep-btn.pri:not(:disabled):hover {
    box-shadow: 0 16px 36px -12px rgba(232, 176, 74, 0.9);
  }
}
.ep-ref {
  margin: 20px 0 0;
  font-size: 0.8125rem;
  color: var(--muted);
}
@media (max-width: 480px) {
  .ep-logo {
    height: 36px;
  }
  .ep-acts {
    flex-direction: column;
  }
  .ep-btn {
    width: 100%;
  }
}
@media (max-height: 560px) and (orientation: landscape) {
  .ep-main {
    flex-direction: row;
    gap: 32px;
  }
  .ep-art {
    font-size: clamp(5rem, 16vw, 9rem);
    margin: 0;
  }
}
@keyframes ep-in {
  from {
    opacity: 0;
    transform: translateY(0.18em) scale(0.92);
  }
}
@keyframes ep-up {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
}
@keyframes ep-fade {
  from {
    opacity: 0;
  }
}
@keyframes ep-shine {
  0%,
  20% {
    background-position: 100% 0;
  }
  60%,
  100% {
    background-position: 0 0;
  }
}
@keyframes ep-float {
  50% {
    translate: 0 -0.04em;
  }
}
@keyframes ep-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes ep-pulse {
  0% {
    opacity: 0.75;
    transform: scale(0.6);
  }
  100% {
    opacity: 0;
    transform: scale(1.9);
  }
}
@keyframes ep-ping {
  0% {
    opacity: 0.7;
    transform: scale(1);
  }
  100% {
    opacity: 0;
    transform: scale(2.8);
  }
}
@keyframes ep-sheen {
  0%,
  55% {
    transform: translateX(-160%) skewX(-20deg);
  }
  85%,
  100% {
    transform: translateX(360%) skewX(-20deg);
  }
}
@keyframes ep-breathe {
  50% {
    opacity: 0.65;
    transform: scale(1.06);
  }
}
@keyframes ep-rise {
  to {
    transform: translateY(-1400px);
  }
}
@keyframes ep-twinkle {
  to {
    opacity: 0.45;
  }
}
@keyframes ep-lattice {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}
@keyframes ep-meteor {
  0% {
    opacity: 0;
    transform: translate(0, 0) rotate(-25deg);
  }
  2% {
    opacity: 1;
  }
  9%,
  100% {
    opacity: 0;
    transform: translate(-460px, 214px) rotate(-25deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
  .ep-d {
    background-position: 50% 0;
  }
}
@media (forced-colors: active) {
  .ep-d {
    background: none;
    color: CanvasText;
    filter: none;
  }
  .ep-card,
  .ep-retry {
    border-color: CanvasText;
  }
  .ep-btn {
    border-color: ButtonText;
  }

    <script>
      (() => {
  const root = document.documentElement;
  const base = root.dataset.base || '/';
  const day = root.dataset.theme === 'daylight';
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const T = JSON.parse($('ep-t').textContent);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = day ? '#f7f1e6' : '#060b1a';
  const logos = [...document.querySelectorAll('img[data-logo]')];
  const size = devicePixelRatio > 1.5 ? 'h128' : 'h64';
  for (const img of logos) {
    img.addEventListener('error', () => {
      img.remove();
      if (!document.querySelector('img[data-logo]')) document.querySelector('.ep-top')?.remove();
    });
    img.src =
      base + 'assets/logos/' + img.dataset.logo + (day ? '' : '-dark') + '-' + size + '.png';
  }
  try {
    $('ep-time').textContent = new Intl.DateTimeFormat('ar-u-nu-latn', {
      dateStyle: 'long',
      timeStyle: 'short',
      hour12: false,
      timeZone: 'Asia/Muscat',
    }).format(new Date());
  } catch {
    $('ep-time').parentElement.remove();
  }
  if (!still && matchMedia('(pointer: fine)').matches) {
    let tx = 0,
      ty = 0,
      x = 0,
      y = 0,
      raf = 0;
    const step = () => {
      x += (tx - x) * 0.08;
      y += (ty - y) * 0.08;
      root.style.setProperty('--px', x.toFixed(3));
      root.style.setProperty('--py', y.toFixed(3));
      raf = Math.abs(tx - x) + Math.abs(ty - y) > 0.002 ? requestAnimationFrame(step) : 0;
    };
    addEventListener(
      'pointermove',
      (e) => {
        tx = (e.clientX / innerWidth) * 2 - 1;
        ty = (e.clientY / innerHeight) * 2 - 1;
        if (!raf) raf = requestAnimationFrame(step);
      },
      { passive: true },
    );
    const card = document.querySelector('.ep-card');
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', e.clientX - r.left + 'px');
      card.style.setProperty('--my', e.clientY - r.top + 'px');
    });
    card.addEventListener('pointerenter', () => card.classList.add('lit'));
    card.addEventListener('pointerleave', () => card.classList.remove('lit'));
  }
  if (root.dataset.kind === '404') {
    const back = $('ep-back');
    let same = false;
    try {
      same = !!document.referrer && new URL(document.referrer).origin === location.origin;
    } catch {
      same = false;
    }
    if (back && same && history.length > 1) {
      back.hidden = false;
      back.addEventListener('click', () => history.back());
    }
    return;
  }
  const own = (to) => {
    if (typeof to !== 'string' || !/^\/(?![/\\])/.test(to)) return null;
    try {
      const u = new URL(to, location.origin);
      return u.origin === location.origin ? u.pathname + u.search + u.hash : null;
    } catch {
      return null;
    }
  };
  let info = null;
  try {
    const raw = JSON.parse(sessionStorage.getItem('majlis.down') || 'null');
    if (raw && typeof raw === 'object') info = raw;
  } catch {
    info = null;
  }
  const onSelf = /\/50x\.html$/.test(location.pathname);
  const to = (info && own(info.to)) || (onSelf ? base : null);
  const probe =
    info && typeof info.probe === 'string' && /^https?:\/\//.test(info.probe) ? info.probe : null;
  const why = info && info.why === 'boot' ? 'boot' : 'api';
  let tries = info && Number.isInteger(info.n) && info.n > 0 ? Math.min(info.n, 3) : 0;
  const nav = performance.getEntriesByType?.('navigation')[0];
  const status = nav && nav.responseStatus;
  const code = status >= 500 && status <= 599 ? status : onSelf ? 503 : 500;
  const title = $('ep-title'),
    text = $('ep-text'),
    chip = $('ep-code');
  $('ep-d3').textContent = String(code % 10);
  chip.textContent = T.code.replace('{c}', code);
  if (onSelf && why === 'boot') {
    title.textContent = T.bootTitle;
    text.textContent = T.bootText;
  } else if (code === 500) title.textContent = T.h500;
  const words = { title: title.textContent, text: text.textContent, chip: chip.textContent };
  const box = $('ep-retry'),
    left = $('ep-left'),
    live = $('ep-live'),
    arc = $('ep-arc'),
    now = $('ep-now');
  const C = 106.8,
    WAITS = [10, 20, 40, 60];
  let timer = 0,
    anim = null,
    busy = false,
    gone = false;
  const state = (s) => (box.dataset.state = s);
  const stop = () => {
    clearInterval(timer);
    anim?.cancel();
    anim = null;
  };
  const timeout = (ms) => (AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);
  function wait() {
    stop();
    const secs = Math.max(
      3,
      Math.round(WAITS[Math.min(tries, WAITS.length - 1)] * (0.8 + Math.random() * 0.4)),
    );
    tries++;
    state('wait');
    let n = secs;
    left.textContent = T.wait.replace('{n}', n);
    if (!still && arc.animate)
      anim = arc.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: C }], {
        duration: secs * 1000,
        easing: 'linear',
        fill: 'forwards',
      });
    timer = setInterval(() => {
      n--;
      if (n > 0) left.textContent = T.wait.replace('{n}', n);
      else check();
    }, 1000);
  }
  async function up() {
    const r = await fetch(probe || to || location.href, {
      cache: 'no-store',
      credentials: probe ? 'omit' : 'same-origin',
      signal: timeout(9500),
    });
    if (!r.ok) return false;
    if (!probe) return true;
    const body = await r.json();
    return !!body && !!body.resp && body.resp.s === 1 && body.i != null;
  }
  async function check() {
    if (busy || gone) return;
    stop();
    if (!navigator.onLine) return offline();
    busy = true;
    now.disabled = true;
    state('check');
    left.textContent = T.check;
    let back = false;
    try {
      back = await up();
    } catch {
      back = false;
    }
    busy = false;
    if (back) return leave();
    now.disabled = false;
    if (!navigator.onLine) return offline();
    live.textContent = T.again;
    wait();
  }
  function leave() {
    gone = true;
    state('ok');
    left.textContent = T.ok;
    live.textContent = T.ok;
    setTimeout(() => (to ? location.replace(to) : location.reload()), still ? 0 : 800);
  }
  function offline() {
    stop();
    state('off');
    root.dataset.off = '';
    title.textContent = T.offTitle;
    text.textContent = T.offText;
    chip.textContent = T.offChip;
    left.textContent = T.off;
    live.textContent = T.off;
    now.disabled = true;
  }
  addEventListener('offline', () => !gone && offline());
  addEventListener('online', () => {
    if (gone) return;
    delete root.dataset.off;
    title.textContent = words.title;
    text.textContent = words.text;
    chip.textContent = words.chip;
    now.disabled = false;
    tries = 0;
    check();
  });
  now.addEventListener('click', () => check());
  if (navigator.onLine) wait();
  else offline();
})();
    </script>
  </body>
