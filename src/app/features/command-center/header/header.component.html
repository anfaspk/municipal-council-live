<div class="cc-logo">
  <img
    class="moi night"
    [attr.src]="logos().moiN.src"
    [attr.srcset]="logos().moiN.srcset"
    width="790"
    height="875"
    decoding="async"
    [alt]="'moiLogoAlt' | t"
  /><img
    class="moi day"
    [attr.src]="logos().moiD.src"
    [attr.srcset]="logos().moiD.srcset"
    width="790"
    height="875"
    decoding="async"
    [alt]="'moiLogoAlt' | t"
  /><i class="cc-logo-sep" aria-hidden="true"></i
  ><img
    class="night"
    [attr.src]="logos().elN.src"
    [attr.srcset]="logos().elN.srcset"
    width="1000"
    height="1082"
    decoding="async"
    [alt]="'elecLogoAlt' | t"
  /><img
    class="day"
    [attr.src]="logos().elD.src"
    [attr.srcset]="logos().elD.srcset"
    width="1000"
    height="1082"
    decoding="async"
    [alt]="'elecLogoAlt' | t"
  />
</div>
<div class="ttl">
  <div class="t">{{ 'title' | t }}</div>
  <div class="cc-subtitle">{{ 'sub' | t }}</div>
</div>
<span class="cc-gap"></span>
<button
  class="mj-btn icon theme"
  type="button"
  [inert]="covered()"
  [title]="'theme' | t"
  [attr.aria-label]="'theme' | t"
  (click)="state.toggleTheme()"
>
  <svg [mjIcon]="state.theme() === 'night' ? 'sun' : 'moon'"></svg>
</button>
<button
  class="mj-btn icon tvb"
  type="button"
  [inert]="covered()"
  [title]="'tv' | t"
  [attr.aria-label]="'tv' | t"
  (click)="screen.show('tv')"
>
  <svg [mjIcon]="'tv'"></svg>
</button>
<button
  class="mj-btn icon ctvb"
  type="button"
  [inert]="covered()"
  [title]="liveCount"
  [attr.aria-label]="liveCount"
  (click)="screen.show('wall')"
>
  <svg [mjIcon]="'ballot'"></svg>
</button>
<button
  class="mj-btn icon wnb"
  type="button"
  [inert]="covered()"
  [title]="'winners' | t"
  [attr.aria-label]="'winners' | t"
  (click)="screen.show('winners')"
>
  <svg [mjIcon]="'medal'"></svg>
</button>
@if (full.offered()) {
  <button
    class="mj-btn icon full"
    type="button"
    [inert]="covered()"
    [title]="(full.on() ? 'fullOff' : 'full') | t"
    [attr.aria-label]="(full.on() ? 'fullOff' : 'full') | t"
    (click)="full.toggle()"
  >
    <svg [mjIcon]="full.on() ? 'shrink' : 'expand'"></svg>
  </button>
}
