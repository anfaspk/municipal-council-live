<span class="mj-crenel"></span><canvas class="incense"></canvas>
<div class="hero-in">
  <div
    class="gwrap"
    [size]="236"
    [label]="(stats.done() ? 'declared' : 'live') | t"
    [sub]="'natTurnout' | t"
    fig="nat.turnout"
    [value]="stats.turnout()"
    [introMs]="introMs"
    [changeMs]="1400"
  ></div>
  <div class="mid">
    <div class="hero-title">{{ 'liveAcross' | t }}</div>
    <div class="hero-stats">
      <div class="hs reg">
        <span class="hs-l"><i class="hs-dot"></i>{{ 'heroRegistered' | t }}</span
        ><b class="mj-num" data-fig="nat.registered">
          @if (regKnown()) {
            {{ fmt(stats.national().registered) }}
          } @else {
            —
          }
        </b>
      </div>
      <div class="hs voted">
        <span class="hs-l"><i class="hs-live"></i>{{ 'heroVotes' | t }}</span
        ><b class="mj-num"
          ><span class="mj-odo o-v" data-fig="nat.voted" [odoValue]="stats.national().voted"></span
        ></b>
      </div>
      <div class="hs yet">
        <span class="hs-l"><i class="hs-live"></i>{{ 'yetToVote' | t }}</span
        ><b class="mj-num">
          @if (regKnown()) {
            <span
              class="mj-odo o-y"
              [odoValue]="stats.national().registered - stats.national().voted"
            ></span>
          } @else {
            —
          }
        </b>
      </div>
    </div>
  </div>
  @defer (on idle) {
    <div class="bb" mvBallot></div>
  } @placeholder {
    <div class="bb"></div>
  }
</div>
