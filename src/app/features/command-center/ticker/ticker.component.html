<span class="lab"><svg [mjIcon]="'trend'"></svg>{{ 'ticker' | t }}</span><div class="vp" aria-hidden="true"><div class="track">@for (c of runs(); track c; let ci = $index) {<span class="tk-run">@for (it of items(); track it.tick) {<span class="mj-tk" [class.new]="ci === 0 && fresh() && $index === 0"><span class="t">{{ it.tick.time }}</span><span>@for (p of it.parts; track $index) {@if (p.bold) {<b>{{ p.text }}</b>} @else {<ng-container>{{ p.text }}</ng-container>}}</span><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><polygon [attr.points]="star"/></svg></span>}</span>}</div></div>
