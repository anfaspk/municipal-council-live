<div class="wn-set">
  <img #pic class="wn-pic" [src]="img" alt="" decoding="async" (load)="onLoad(pic)">
  <div class="wn-night">
    @for (s of stars; track $index) {<i class="wn-sstars" [style.--stars]="s" [style.--l]="$index"></i>}
    <i class="wn-meteor"></i><i class="wn-meteor m2"></i>
  </div>
  <i class="wn-hglow"></i>
  <i class="wn-mist"></i>
  <i class="wn-lamps"></i>
</div>
