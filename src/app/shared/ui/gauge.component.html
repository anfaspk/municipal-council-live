<svg [attr.viewBox]="'0 0 ' + s + ' ' + s" aria-hidden="true"><defs><linearGradient [attr.id]="id" x1="0" y1="0" x2="1" y2="0"><stop class="gs0" offset="0"/><stop class="gs1" offset=".55"/><stop class="gs2" offset="1"/></linearGradient><filter [attr.id]="id + 'f'" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur [attr.stdDeviation]="4 * k"/></filter></defs>@for (t of ticks; track $index) {<line class="tick" [attr.x1]="t.x1" [attr.y1]="t.y1" [attr.x2]="t.x2" [attr.y2]="t.y2"/>}<path class="mj-track" [attr.d]="arc" fill="none" [attr.stroke-width]="sw" stroke-linecap="round"/><path class="glow" [attr.d]="arc" fill="none" [attr.stroke]="'url(#' + id + ')'" [attr.stroke-width]="sw" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" [attr.filter]="'url(#' + id + 'f)'" opacity=".7"/><path class="val" [attr.d]="arc" fill="none" [attr.stroke]="'url(#' + id + ')'" [attr.stroke-width]="sw" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/><path class="tip" [attr.d]="tip" fill="none" [attr.stroke-width]="2 * k" stroke-linecap="round" opacity=".85"/><circle class="hilt" [attr.cx]="hilt.cx" [attr.cy]="hilt.cy" [attr.r]="hilt.r" fill="none" stroke-width="1.5"/>@for (m of milestones; track $index) {<circle class="ms" [attr.cx]="m.cx" [attr.cy]="m.cy" r="2.2"/>}<g class="sparks"></g></svg><div class="center"><div class="mj-micro gold">{{ label() }}</div><div class="big"><span class="n">0.0</span><small class="u">%</small></div>@if (sub()) {<div class="mj-muted sub">{{ sub() }}</div>}</div>
