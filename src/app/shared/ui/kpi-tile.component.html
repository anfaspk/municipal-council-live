<div class="holo"></div><div class="ghost"><svg [mjIcon]="kpi().icon"></svg></div><div class="top"><div class="mj-kpi-header">{{ kpi().label }}</div><svg class="mj-ring" role="img" [attr.width]="ring().size" [attr.height]="ring().size" [attr.viewBox]="'0 0 ' + ring().size + ' ' + ring().size" [attr.aria-label]="pct(kpi().ring)"><circle [attr.cx]="ring().half" [attr.cy]="ring().half" [attr.r]="ring().r" fill="none" class="mj-track" stroke-width="3.5"/><circle [attr.cx]="ring().half" [attr.cy]="ring().half" [attr.r]="ring().r" fill="none" [style.stroke]="kpi().ringColor || 'var(--gold)'" stroke-width="3.5" stroke-linecap="round" [attr.stroke-dasharray]="ring().dash" [attr.transform]="ring().rot"/><text text-anchor="middle" dominant-baseline="central" [attr.x]="ring().half" [attr.y]="ring().half">{{ ring().text }}</text></svg></div><div class="val mj-num">@if (value() === null) {<span class="v mj-odo">—</span>} @else {<span class="v mj-odo" [odoValue]="value() ?? 0" [odoInstant]="kpi().instant"></span>}</div><div class="foot"><span>{{ kpi().foot }}</span><svg class="mj-spark" aria-hidden="true" [attr.viewBox]="'0 0 ' + spark().w + ' ' + spark().h" [attr.width]="spark().w" [attr.height]="spark().h"><defs><linearGradient [attr.id]="id" x1="0" y1="0" x2="0" y2="1"><stop offset="0" [style.stop-color]="kpi().sparkColor || 'var(--data-cyan)'" stop-opacity=".32"/><stop offset="1" [style.stop-color]="kpi().sparkColor || 'var(--data-cyan)'" stop-opacity="0"/></linearGradient></defs><path [attr.d]="spark().area" [attr.fill]="'url(#' + id + ')'"/><path [attr.d]="spark().d" fill="none" [style.stroke]="kpi().sparkColor || 'var(--data-cyan)'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle [attr.cx]="spark().cx" [attr.cy]="spark().cy" r="2.6" [style.fill]="kpi().sparkColor || 'var(--data-cyan)'"/></svg></div>
